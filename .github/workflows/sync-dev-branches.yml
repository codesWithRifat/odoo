name: Sync Dev Branches After Staging Update

on:
  pull_request:
    types:
      - closed
    branches:
      - staging

permissions:
  contents: write

jobs:
  sync-dev-branches:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target_branch:
          - dev-lamia
          - dev-humayra
          - dev-rifat

    steps:
      - name: Skip source branch
        if: matrix.target_branch == github.event.pull_request.head.ref
        run: |
          echo "Skipping source branch: ${{ matrix.target_branch }}"

      - name: Checkout repository
        if: matrix.target_branch != github.event.pull_request.head.ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        if: matrix.target_branch != github.event.pull_request.head.ref
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Merge staging into target branch
        if: matrix.target_branch != github.event.pull_request.head.ref
        run: |
          git fetch origin
          git checkout ${{ matrix.target_branch }}
          git merge origin/staging --no-edit
          git push origin ${{ matrix.target_branch }}
